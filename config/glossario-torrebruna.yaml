  # Petolini non e' Petolini: Letto sulla pagina: nascita n. 27 del 1809, «nato in costanza del suo legittimo matrimonio con Celidata Petolini»: Petolini scritto per intero. E' la famiglia della moglie di Giuseppe Pepe, non Pettine.
  - "Petolini"
  # Petti non e' Pelle: Gemini legge sulla pagina la forma rara, le due forme non si confondono per la forma delle lettere, e la maggior parte delle sue righe risiede fuori dal comune. Letture: «Petti» (0.95). «Petti» 2 volte, «Pelle» 28; insieme nello stesso atto: 0; somiglianza 0.82; righe con residenza fuori comune: 1.
  - "Petti"
  # Scialli non e' Scialli: Letto sulla pagina: nascita del 1811, «in costanza del suo legittimo matrimonio con Domenica Scialli»: la S iniziale e' scritta, non e' Cialli.
  - "Scialli"
  # Sisto non e' Sisto: Letto sulla pagina: nascita n. 61 del 1881, a margine «Sisto Luigi» e nel testo «e' comparso Sisto Giovanni»: Sisto scritto per intero, non Sisti.
  - "Sisto"
  # Tulli non e' Tulli: Letto sulla pagina: matrimonio del 1879, «2.° la nubile Tulli Concetta, filatrice, nata in Torrebruna»: Tulli scritto per intero, non Tullio.
  - "Tulli"
  # di Zillo non e' di Zillo: Letto sulla pagina: nascita del 1842, «nato da Teresa di Zillo sua moglie legittima, di anni trentacinque»: la Z e' scritta, non e' di Lillo.
  - "di Zillo"

# Mestieri che sono lo stesso mestiere detto in due modi.
#
# La statistica sa riconoscere una grafia rovinata — 'Agrimenfore' per
# 'Agrimensore', dove la 'ſ' lunga e' stata letta 'f' — perche' le due
# forme si somigliano. Non sa riconoscere due parole diverse per la
# stessa occupazione: 'bovajo' e 'bovaro' stanno a 0,83, sotto la soglia
# che pretende due grafie della stessa parola, e alzarla farebbe
# collassare 'muratore' su 'proprietario'.
#
# Questo e' il posto dove entra chi conosce il mestiere e il paese. La
# chiave e' la forma da tenere; sotto, i modi in cui si e' vista scritta.
# La lettura originale resta comunque nel campo 'grezzo' dei fatti.
mestieri:
  # la s lunga letta f, g o p, e la r finale persa: nessuna di queste forme e' un mestiere
  "agrimensore":
    - "agrimenfore"
    - "agrimengore"
    - "aprimensore"
    - "ageimensore"
    - "agrimesore"
    - "agrimenso[re]"
    - "agrimenso[r]e"
    - "agrimensoio"
    - "agrimentoce"
  "assessore anziano funzionante da sindaco":
    - "assessore anziano fuzionante da sindaco"
    - "assessore anziano fuzionante di sindaco"
    - "assessore anziano f. d. sindaco"
  "assessore funzionante da sindaco":
    - "assessore funtionante da sindaco"
    - "assessore f[unzionante] da sindaco"
  "assessore funzionante di sindaco":
    - "assessore funziomante di sindaco"
    - "assessore f[unzionante] di sindaco"
    - "assessore funziomante [sic] di sindaco"
  "barilaro":
    - "bariloro"
    - "barilero"
  "battilana":
    - "cattilana"
    - "bettilana"
    - "tattilana"
  "battilano":
    - "cattilano"
    - "bettilano"
  # 'bovaio' e' lo stesso mestiere detto in un altro modo; 'bavaro' e 'bovero' sono la vocale letta male
  "bovaro":
    - "bavaro"
    - "bovero"
    - "bovaio"
  # 'bracciante' e 'bracciale' sono lo stesso lavoratore a giornata: nei registri meridionali le due parole si alternano
  "bracciale":
    - "braciale"
    - "bracciante"
  # 'calzolaro' e' la forma regionale; 'alzolaio' e 'coltolaio' sono letture rovinate
  "calzolaio":
    - "calzolaro"
    - "alzolaio"
    - "coltolaio"
  "condizione contadina":
    - "condizionatrice contadina"
  "contadino":
