# Forme attestate di Torrebruna: quello che la statistica non puo' sapere.
#
# La fase 5 sfrutta la ridondanza dei registri per scoprire le letture
# sbagliate, ma sa solo scegliere FRA LE FORME CHE QUALCUNO HA LETTO. Se
# una grafia viene letta male sempre allo stesso modo, il consenso e'
# concorde e sbagliato, e nessuna quantita' di dati lo corregge: la
# rileggerebbe male anche la millesima volta.
#
# Due esempi veri, dalle prime pagine del 1809:
#
#   "Rua di Nuorro"     letto "Lama di Nuorro", due volte su due, concordi.
#                       Per una frequenza non c'e' niente da segnalare.
#   "strada Trascinella"  letto "Trafficinella" e "Frascinella", una volta
#                       ciascuna. La forma giusta non compare MAI nei dati,
#                       quindi nessuna normalizzazione puo' arrivarci.
#
# Questo file e' l'unico posto dove entra la conoscenza del paese. Serve a
# due cose, e la prima vale piu' della seconda:
#
#   1. entra nel PROMPT, cosi' il modello riconosce il toponimo mentre
#      legge, invece di indovinarlo. Previene l'errore, non lo ripara;
#   2. entra nella fase 4, che mappa le letture errate gia' raccolte sulla
#      forma corretta senza ritrascrivere niente (e senza consumare quota).
#
# La lettura originale resta sempre in 'cognome_letto' / 'residenza_letta':
# correggere qui non cancella mai cio' che c'era scritto sulla carta.

# Toponimi del comune: strade, contrade, porte, chiese, localita'.
# La chiave e' la forma corretta; l'elenco sono le letture errate viste.
# Il confronto ignora maiuscole e accenti e avviene dentro il testo, non
# sull'intero campo: "strada a piedi della Lama di Nuorro" diventa
# "strada a piedi della Rua di Nuorro".
toponimi:
  # Confermate da chi conosce il paese. Le grafie sotto ciascuna sono
  # quelle davvero incontrate nei registri del 1809.
  # La chiave e' il solo nome della contrada, senza 'strada' o 'via': la
  # sostituzione avviene dentro la frase, che quel termine ce l'ha gia'.
  # Scrivendo 'strada Trascinella' si otterrebbe 'strada della strada
  # Trascinella'.
  Trascinella:
    # Sette letture diverse, e la forma giusta non compare in NESSUNA di
    # esse: e' il caso che nessuna statistica avrebbe potuto raddrizzare.
    - Fiascinella
    - Frascinella
    - Fraccinella
    - Fraginella
    - Fresinella
    - Trecinella
    - Trafficinella
    # verificate sull'immagine (Gemini), glossario 2026-09
    - "Frosinella"
    - "Mascinella"
    - "Tarsinella"
  Rua di Nuorro:
    - Lama di Nuorro
    - Rua di Nuovo
    - Via di Nuovo
    - Bua di Nuovo
    # Verificate sull'originale (processetti/0048): la 'R' di questa mano
    # ha un occhiello che la fa leggere 'B' o 'V', e 'Nuorro' diventa
    # 'Ricovro'. Sulla stessa formula, in un altro registro, il modello
    # legge invece 'a Capo la Rua di Nuorro' senza esitare.
    - Via di Ricovro
    - Rua di Ricovro
    # Verificata sull'originale (processetti/0056), stessa formula
    # 'a Capo la Rua di Nuorro' letta altrove senza esitazione.
    - Cesa di nuovo
    - Cesa di Nuovo
  Porta Murella:
    - Porta delle Murelle
    - Porta delle Muselle
    - Portamurella
    - Portanuvella
    - Porta murella
  # Accettati dalle proposte del giro 1809-1810.
  strada della Porta Murella:
    - strada di Portamurella
  strada di Sotto la Chiesa:
    - strada d'avanti la Chiesa

# Cognomi delle famiglie del paese. Stessa forma: chiave corretta,
# elenco delle letture errate da ricondurvi.
#
# Attenzione: qui NON vanno i cognomi dei forestieri. Una sposa che arriva
# da un comune vicino porta un cognome che a Torrebruna e' raro ed e'
# giusto che resti raro: e' il segnale della mobilita' matrimoniale fra
# paesi, ed e' fra i piu' interessanti che questi registri contengano.
  "Cerro":
    # verificate sull'immagine (Gemini), glossario 2026-09
    - "Cerra"
    - "Cesso"
  "Cima della Torre":
    # verificate sull'immagine (Gemini), glossario 2026-09
    - "Bima della Terra"
    - "Cima dell'Orto"
    - "Cima della Terra"
    - "Cimadella Torra"
  "De Amicis":
    # verificate sull'immagine (Gemini), glossario 2026-09
    - "dei Amici"
  "Duomo":
    # verificate sull'immagine (Gemini), glossario 2026-09
    - "Duono"
    - "Fuomo"
  "Fontanella":
    # verificate sull'immagine (Gemini), glossario 2026-09
    - "Fontanelle"
    - "Fontanelli"
    - "Fontanello"
  "Inforchia":
    # verificate sull'immagine (Gemini), glossario 2026-09
    - "Inferchice"
    - "Inforchie"
    - "Porforchia"
  "Montecalvario":
    # verificate sull'immagine (Gemini), glossario 2026-09
    - "Monte Colbario"
    - "Montecolbario"
  "Nuorro":
    # verificate sull'immagine (Gemini), glossario 2026-09
    - "Muoro"
  "Orientale":
    # verificate sull'immagine (Gemini), glossario 2026-09
    - "Oricutolo"
  "Piazza":
    # verificate sull'immagine (Gemini), glossario 2026-09
    - "Piazzo"
    - "Pizzo"
  "Pirro":
    # verificate sull'immagine (Gemini), glossario 2026-09
    - "Perro"
  "Porta del Colle":
    # verificate sull'immagine (Gemini), glossario 2026-09
    - "La del Colle"
  "Taverna":
    # verificate sull'immagine (Gemini), glossario 2026-09
    - "Caverna"
    - "Tavernadè"
    - "Teverne"
  "Vicenne":
    # verificate sull'immagine (Gemini), glossario 2026-09
    - "Vicente"
    - "Vicoine"
    - "Vivenze"
  "Vignevecchie":
    # verificate sull'immagine (Gemini), glossario 2026-09
    - "Pignavecchia"
    - "Vigne Vecchie"
    - "Vignecchia"
    - "Vignecchie"
    - "in via Vignevecchie"
cognomi:
  # Decisioni prese sulle proposte della fase 5 dopo il giro 1809-1810
  # (data/dataset/glossario-proposto.yaml). La chiave e' la forma buona.
  Cicchillitti:
    - Cicchillotto
    - Cicchilotti
    - Cicchitelli
    - Cicchitieri
    - Cicchitti
    # Cicchillitto: La stessa famiglia con la desinenza dei primi decenni (Domenico Cicchillitto, testimone nella nascita n. 14 del 1822) e quella degli anni dopo. Le due forme stanno insieme in due atti su 291: da ricontrollare, ma la desinenza -o/-i non fa due casati.
    - "Cicchillitto"
  Pizzi:
    - Lizzi
  Bracchi:
    - Branchi
    # Perrichi: Letto sulla pagina: morte del 1830, «e' morto nella sua casa Ermenegildo Bracchi d'anni due ... figlio di Carlo Bracchi, contadino». Carlo Bracchi torna come padre e dichiarante in altri atti di quegli anni. La proposta Perrecchi era sbagliata.
    - "Perrichi"
  # La L maiuscola della cancelleresca si legge F o C con la stessa
  # facilita': 'Fella' (67), 'Felle' (23), 'Cella' (27) e 'Celle' (5)
  # contro 1.375 'Lella'. Il calcolo le aveva gia' proposte — 'Fella'
  # sta a 0,94 da 'Lella' — ma non poteva applicarle da solo, perche' la
  # stessa regola trascinerebbe 'Villa' e 'Stella', che famiglie vere
  # potrebbero esserlo. Qui la decisione e' presa: a Torrebruna sono Lella.
  Lella:
    - Della
    - Leppa
    - Fella
    - Felle
    - Cella
    - Celle
    # Cinque occorrenze contro le 556 di 'Lella', e in nessun atto le due
    # forme stanno insieme. Costava caro: la nascita n. 36 del 1885 e'
    # l'unico atto che dia a Domenicantonio Lella il primo figlio maschio,
    # Nicola Maria — cioe' il nome del nonno paterno, l'unico indizio che
    # lo attacchi a Nicola Lella, visto che i registri dei nati dal 1861
    # al 1865 mancano.
    - Gella
    # Litta: La stessa persona scritta con la forma giusta in un altro atto: Domenico n.1800 «Litta» (atto 2589) = «Lella» n.1798 (atto 2070). Vale per 2 delle 3 righe di «Litta» che dicono un'eta'.
    - "Litta"
    # Sillà: La stessa persona scritta con la forma giusta in un altro atto: Nicola n.1800 «Sillà» (atto 3074) = «Lella» n.1802 (atto 1829). Vale per 1 delle 2 righe di «Sillà» che dicono un'eta'.
    - "Sillà"
  Troilo:
    - Trojlo
    # Troile: La stessa persona scritta con la forma giusta in un altro atto: Raffaele n.1805 «Troile» (atto 3096) = «Troilo» n.1803 (atto 1255). Vale per 2 delle 3 righe di «Troile» che dicono un'eta'.
    - "Troile"
    # Crojile: Letto sulla pagina: nascita n. 38 del 1883, a margine «Troilo Irene», e nel testo «e' comparso Troilo Pietro, di anni trentacinque»: la T corsiva letta C e la i con la coda lunga letta j. E' la famiglia Troilo (Vincenzo Troilo, Clementina Troilo), letta in quattro modi: Crojile, Crojle, Crojla, Crojlo.
    - "Crojile"
    # Crojle: Letto sulla pagina: nascita n. 38 del 1883, a margine «Troilo Irene», e nel testo «e' comparso Troilo Pietro, di anni trentacinque»: la T corsiva letta C e la i con la coda lunga letta j. E' la famiglia Troilo (Vincenzo Troilo, Clementina Troilo), letta in quattro modi: Crojile, Crojle, Crojla, Crojlo.
    - "Crojle"
    # Crojla: Letto sulla pagina: nascita n. 38 del 1883, a margine «Troilo Irene», e nel testo «e' comparso Troilo Pietro, di anni trentacinque»: la T corsiva letta C e la i con la coda lunga letta j. E' la famiglia Troilo (Vincenzo Troilo, Clementina Troilo), letta in quattro modi: Crojile, Crojle, Crojla, Crojlo.
    - "Crojla"
    # Crojlo: Letto sulla pagina: nascita n. 38 del 1883, a margine «Troilo Irene», e nel testo «e' comparso Troilo Pietro, di anni trentacinque»: la T corsiva letta C e la i con la coda lunga letta j. E' la famiglia Troilo (Vincenzo Troilo, Clementina Troilo), letta in quattro modi: Crojile, Crojle, Crojla, Crojlo.
    - "Crojlo"
  Rossi:
    - Rosso
    - Bossi
    - Basso
  # Le grafie di 'Moretta', una delle famiglie grosse del paese: 997
  # occorrenze contro le 87 di tutte queste messe insieme, e nessuna
  # compare accanto a 'Moretta' in un atto — il controllo sulle fusioni
  # le da' pulite tutte. Il caso che le ha fatte trovare: Carmine
  # Moretta, marito di Maria Lella, e' scritto 'Montta' nell'atto di
  # morte della figlia Secondina nel 1826 e 'Motta' in quello del figlio
  # Carmine nel 1839, e cosi' era diventato tre uomini.
  Moretta:
    - Motta
    - Montta
    - Mocetta
    - Moutta
    # Due occorrenze, tutte e due come moglie di Domenico Di Nardo negli
    # atti di morte dei suoi due figli, 1828 e 1829: e' la stessa
    # 'Moutta' con una lettera in piu'.
    - Mouton
    # Montra: Matrimonio n. 11 del 1834, foglio 3: «Maria Fiorenza [...] Moretta, figlia di Arcadio Moretta e di Felicia Desiderio». Gemini legge 'Montra' anche li': stessa mano, stesso errore.
    - "Montra"
    # Monta: Matrimonio n. 6 del 1852: Raffaele Lella «figlio dei coniugi fu Giuseppe Lella e fu Grazia Moretta» — la trascrizione aveva «Marta Monta».
    - "Monta"
    # Moschetta: Letto sulla pagina: nascita n. 9 del 1835, «e' comparso Vincenzo Moretta, di anni trenta, contadino». E nell'albero lo stesso Domenico Pelliccia aveva una moglie «Angela Moretta» con cinque figli e una «Angela Moschetta» con uno: e' la stessa donna. La proposta Marchetti era sbagliata.
    - "Moschetta"
    # Mosetta: Per analogia con tre pagine lette della stessa mano: «Vincenzo Moretta» letto Moschetta (1835), «Amadeo Moretta» letto Masetta (1810), «Domenicangelo Moretta» letto Mastro (1838) — la r di Moretta e' scritta come una s lunga. Le righe di Mosetta sono la sposa Maria Fiorenza (1832, ventiquattro anni, cioe' nata nel 1808 come Fiorenza Moretta) e suo padre Andrea: la famiglia Moretta. Non ho letto un
    - "Mosetta"
    # Moratta: Letto sulla pagina: nascita del 1833, «nata da Angela Moretta, sua moglie legittima, di anni ventitre»; la stessa mano scrive «Sabatino Moratta» nel matrimonio del 1833, con la e aperta come una a. E' la famiglia Moretta. La proposta Marotta era sbagliata.
    - "Moratta"
    # Masetta: Letto sulla pagina: nascita del 1810, «e' comparso Amadeo Moretta»: la o e la r di questa mano, lette a e s. La proposta Mosetta era a sua volta una lettura sbagliata di Moretta.
    - "Masetta"
    # Mastro: Letto sulla pagina: nascita del 1838, «alla presenza di Domenicangelo Moretta, di anni trentatre, contadino»: e' Domenicangelo Moretta, che nell'archivio ha la sua scheda. La proposta Mastri era sbagliata.
    - "Mastro"
    # Mostra: Letto sulla pagina: nascita del 1840, «e di Piersisto Moretta, contadino»: la r di Moretta di questa mano letta s, come in Mosetta e Masetta. La proposta Mastro era a sua volta una lettura sbagliata di Moretta.
    - "Mostra"
    # Montin: Letto sulla pagina: nascita del 1833, «e' comparso Placido Moretta, di anni ventisette»: la r e le due t di Moretta di questa mano, lette nti. La proposta Montini era sbagliata.
    - "Montin"
    # Montina: Letto sulla pagina: nascita del 1830, «alla presenza di Vincenzo Moretta, di anni cinquanta, contadino»: la stessa forma di Moretta letta Montin nel 1833. La proposta Montin era sbagliata.
    - "Montina"
    # Monca: Letto sulla pagina: nascita del 1836, «nato da Maria Letizia Moretta, sua moglie legittima, di anni ventidue»: e' Maria Letizia Moretta, moglie di Giuseppe Marianacci (il caso di Saba Mosca). La proposta Manca era sbagliata.
    - "Monca"
  # 'Torzo', 'Bozzo' e 'Toro' erano nelle proposte anche come voci a se':
  # ricondotti qui, altrimenti la correzione si ferma a meta' strada
  # (una sola passata: 'Toro' sarebbe diventato 'Torzo' e li' restava).
  #
  # 'Lozzi' stava qui, e non e' una lettura errata: e' un'altra famiglia.
  # Tre prove, e la terza da sola basterebbe.
  #   1. e' piu' frequente della forma che avrebbe corretto — 594 volte
  #      in 407 atti contro le 351 di 'Torzi'. Una grafia sbagliata piu'
  #      diffusa di quella giusta non e' una grafia sbagliata;
  #   2. la 'L' e' inequivocabile. Sul matrimonio n. 6 del 1813 la mano
  #      scrive «di Ferdinando Lozzi» e due righe sotto «domiciliato in
  #      Torrebruna»: l'occhiello della L e la testa orizzontale della T
  #      sono due lettere diverse, nella stessa penna;
  #   3. i due cognomi stanno nella STESSA riga dello stesso atto. Nel
  #      n. 376 del 1814: «Crescenzo Torzi dichiarante Ferdinando Lozzi
  #      Testimone». Nel 524 e nel 526 Ermenegildo Lozzi firma da Sindaco
  #      gli atti dei figli di Crescenzio Torzi.
  # Finche' e' rimasta qui, 428 menzioni di Lozzi sono entrate
  # nell'archivio come Torzi, e l'albero ha attaccato figli di una
  # famiglia al padre dell'altra.
  Torzi:
    - Torzo
    - Bozzi
    - Bozzo
    - Tozzo
    - Iozzo
    - Toro
    - Jorzo
    # Zorzo: Letto sulla pagina: morte del 1813, «Ferdinando Maria Torzo figlio di Crescenzo Torzo, ed Allegrezza Boscia»: la T maiuscola di questa mano, col suo ricciolo, e' letta Z, come in «Francesco Zorzi» che le altre righe scrivono Torzi. E' la famiglia Torzi.
    - "Zorzo"
    # Zorgi: Letto sulla pagina: morte del 1880, «e' morta Torzi Lucia, di mesi sette ... da Giuseppe, contadino, e da Lella Grazia»: la T maiuscola letta C o Z, come in Zorzo, Ioro e Zoiro. La proposta Zorzi era a sua volta una lettura sbagliata di Torzi.
    - "Zorgi"
    # Ioro: Letto sulla pagina: morte del 1821, «Angela Maria Ioro ... figlia di Crescenzo Torzo e di Albenzia Boscia»; nella morte del 1817 la stessa coppia e' «Crescenzo Torzo e Albenzia Bosia». La T letta I e rz letto r: e' la famiglia Torzi. La proposta Iorio era sbagliata.
    - "Ioro"
    # Zoiro: Letto sulla pagina: morte del 1826, «Maria Celeste Lella di mesi dieci ... figlia di Domenico Lella e di Angela Torzo»: la T col ricciolo letta Z e rz letto ir, come in Zorzo e Ioro. E' Angela Maria Torzi, moglie di Domenico Lella. La proposta Doiro era sbagliata.
    - "Zoiro"
  # 'Chieffo', 'Chiehi', 'Chichi' e 'Chicli' sono la stessa famiglia letta
  # male: 98 occorrenze in tutto contro le 1811 di 'Chielli', e nessuna
  # coesistenza — 'Chieffo' compare insieme a 'Chielli' in un atto solo,
  # gli altri in nessuno. La ricostruzione le riconosceva gia' come
  # varianti dello stesso individuo, ma solo dove aveva abbastanza
  # appigli: nel campo 'cognome' restavano quattro casati diversi, e
  # bastava un atto isolato — la morte di Fiorinda nel 1834 — perche' una
  # persona finisse in una famiglia che non esiste.
  Chielli:
    - Chiello
    - Chiuli
    - Chieffo
    - Chiehi
    - Chichi
    - Chicli
  # 'De Plata' e 'De Plato' sono la stessa famiglia: ventisei occorrenze
  # contro tredici, e in nessun atto le due forme stanno insieme. Antonio
  # De Plato, pastore, e' scritto nei due modi nello stesso decennio, e i
  # suoi figli si dividevano fra i due casati.
  De Plato:
    - De Plata
  # Verificato sull'immagine (matrimonio n. 3 del 1876, Celenza sul
  # Trigno): la pagina scrive «Vedovo Francesco Saverio Vespasiano». La
  # ſ lunga davanti alla p e' stata letta come una seconda p, e la 'o'
  # finale come 'e'. Il nome giusto nell'archivio non compare mai: e'
  # esattamente il caso che nessuna statistica puo' raddrizzare.
  Vespasiano:
    - Veppasiane
  # Il casato di Castiglione Messer Marino delle due mogli di Costanzo
  # Pacilli. L'atto di morte n. ... del 1893 dice «Maria Nicola Cusilvio,
  # nata in Castiglione Messer Marino, moglie di Paoli Costanzo»: e' la
  # sposa del matrimonio del 1885, letta li' 'Concio'. Nel 1895 Costanzo,
  # vedovo, sposa Rosa Antonia, letta 'Cusbilio' — la stessa mano, la
  # stessa famiglia. Non e' un cognome del paese e resta raro: qui si
  # scrive solo che le tre letture sono una.
  Cusilvio:
    - Cusbilio
    - Concio
  # Trentatre occorrenze contro sette, e in nessun atto le due forme
  # stanno insieme.
  Corzi:
    - Corri
    # Corzo: La stessa persona scritta con la forma giusta in un altro atto: Giuseppe n.1856 «Corzo» (atto 7046) = «Corzi» n.1855 (atto 5500). Vale per 1 delle 1 righe di «Corzo» che dicono un'eta'.
    - "Corzo"
  Conca:
    - Cinca
  Pannunzio:
    - Lannunzio
    # Cannunzio: La stessa persona scritta con la forma giusta in un altro atto: Domenicantonio n.1840 «Cannunzio» (atto 4821) = «Pannunzio» n.1839 (atto 4121). Vale per 3 delle 6 righe di «Cannunzio» che dicono un'eta'.
    - "Cannunzio"
    # D'Ascenzo: Letto sulla pagina: morte del 1841, «e' morto nella sua casa ... Pannunzio di mesi nove, nato in Torrebruna»: il casato e' Pannunzio. La proposta D'Argenio era sbagliata.
    - "D'Ascenzo"
  Femminilli:
    - Semmonelli
    - Semenzilli
    - Terminielli
    # Femminillo: La stessa persona scritta con la forma giusta in un altro atto: Maria n.1789 «Femminillo» (atto 726) = «Femminilli» n.1790 (atto 433). Vale per 3 delle 6 righe di «Femminillo» che dicono un'eta'.
    - "Femminillo"
  Pelliccia:
    - Pelliciola
    # Felliccia: La stessa persona scritta con la forma giusta in un altro atto: Clementina n.1822 «Felliccia» (atto 3282) = «Pelliccia» n.1822 (atto 3404). Vale per 1 delle 1 righe di «Felliccia» che dicono un'eta'.
    - "Felliccia"
    # Lillici: La stessa persona scritta con la forma giusta in un altro atto: Giuseppe n.1813 «Lillici» (atto 2775) = «Pelliccia» n.1812 (atto 2704). Vale per 3 delle 3 righe di «Lillici» che dicono un'eta'.
    - "Lillici"
    # Zellicia: La stessa persona scritta con la forma giusta in un altro atto: Vincenzo n.1833 «Zellicia» (atto 3873) = «Pelliccia» n.1832 (atto 3472). Vale per 2 delle 2 righe di «Zellicia» che dicono un'eta'.
    - "Zellicia"
    # Celli: Letto sulla pagina: nascita del 1845, «e di Aneta Pelliccia, contadino»: la P maiuscola e la cc di questa mano, lette C e ll. La proposta Cilli era sbagliata.
    - "Celli"
    # Pettina: Letto sulla pagina: morte del 1821, «e' morta ... Maria Felicia Pelliccia, nata in Torrebruna ... figlia del ... Pelliccia»: la doppia l e la cc lette tt e n. La proposta Pettine era sbagliata.
    - "Pettina"
    # Di Pillo: Letto sulla pagina: morte del 1841, «e Tommaso di Giuseppe Pelliccia, di anni cinquantasei, contadino»: «di Pillo» e' il patronimico «di Giuseppe» letto male, e il casato, Pelliccia, era finito nel nome. La proposta Di Pilla era sbagliata.
    - "Di Pillo"
    # Petrina: Letto sulla pagina: nascita del 1839, «alla presenza di Emilio Pelliccia, contadino»: la doppia l e la cc di questa mano, lette tr e n, come in Pettina. La proposta Pettina era a sua volta sbagliata.
    - "Petrina"
    # Pettena: Letto sulla pagina: morte del 1837, «sono comparsi Panfilo Colella ... e Nicola Pelliccia di anni quarantotto, contadino». La proposta Pettina era a sua volta sbagliata.
    - "Pettena"
  Tilli:
    - Lilli
    # Cilli: Letto sulla pagina: nascita del 1879, «da Tilli Filomena, di anni trentasette, sua moglie legittima»: la T maiuscola con l'occhiello letta C, come in Pilli (Giuseppe Tilli, 1869) e in Crojlo (Troilo). La proposta Pilli era a sua volta sbagliata.
    - "Cilli"
